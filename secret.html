<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Secret</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="secret-page">

    <!-- =========================
         SECRET PAGE CONTENT
    ========================== -->

    <main class="secret-page-content">

        <!-- Keep or place your original secret page content here -->

    </main>


    <!-- =========================
         PAGE FADE
    ========================== -->

    <div
        class="page-fade"
        id="pageFade"
        aria-hidden="true"
    ></div>


    <!-- =========================
         PAGE NAVIGATION
    ========================== -->

    <script>
        document.addEventListener("keydown", function (event) {
            if (event.key !== "Escape") {
                return;
            }

            const pageFade =
                document.getElementById("pageFade");

            if (pageFade) {
                pageFade.classList.add("show");

                pageFade.setAttribute(
                    "aria-hidden",
                    "false"
                );
            }

            window.setTimeout(function () {
                window.location.href = "memory.html";
            }, 700);
        });

        /*
          Removes the fade if this page is restored
          using the browser Back button.
        */
        window.addEventListener("pageshow", function () {
            const pageFade =
                document.getElementById("pageFade");

            if (!pageFade) {
                return;
            }

            pageFade.classList.remove("show");

            pageFade.setAttribute(
                "aria-hidden",
                "true"
            );
        });
    </script>

</body>

</html>
