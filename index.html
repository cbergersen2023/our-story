<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chris & Gaby</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Pacifico&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="cute-landing-page">

  <div class="floating-heart heart-one">❤</div>
  <div class="floating-heart heart-two">❤</div>
  <div class="floating-heart heart-three">❤</div>
  <div class="floating-heart heart-four">❤</div>

  <main class="cute-card">

    <p class="cute-label">
      Happy Anniversary
    </p>

    <h1>Chris & Gaby</h1>

    <p class="cute-message">
      A little website filled with our favorite memories,
      favorite moments, and the story we keep writing together.
    </p>

    <a
      href="profile.html"
      id="openStoryButton"
      class="open-story"
    >
      Open Our Story ❤️
    </a>

  </main>

  <div
    class="story-page-fade"
    id="storyPageFade"
    aria-hidden="true"
  ></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const openStoryButton =
        document.getElementById("openStoryButton");

      const storyPageFade =
        document.getElementById("storyPageFade");

      if (!openStoryButton || !storyPageFade) {
        return;
      }

      openStoryButton.addEventListener("click", function (event) {
        event.preventDefault();

        const nextPage =
          openStoryButton.getAttribute("href");

        storyPageFade.classList.add("active");

        window.setTimeout(function () {
          window.location.href = nextPage;
        }, 850);
      });
    });

    window.addEventListener("pageshow", function () {
      const storyPageFade =
        document.getElementById("storyPageFade");

      if (storyPageFade) {
        storyPageFade.classList.remove("active");
      }
    });
  </script>

</body>

</html>
